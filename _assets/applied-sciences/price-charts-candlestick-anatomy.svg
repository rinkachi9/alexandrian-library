<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a candlestick</title>
  <desc id="d">Two candles. A bullish candle has a white body, where the close is above the open. A bearish candle has a dark body, where the close is below the open. Thin lines called shadows reach the high and the low.</desc>
  <rect width="620" height="300" fill="#fbfaf6"/>
  <text x="310" y="28" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">Anatomy of a candlestick</text>
  <line x1="150" y1="60" x2="150" y2="250" stroke="#1f2a44" stroke-width="2"/>
  <rect x="125.0" y="110" width="50" height="80" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/>
  <line x1="470" y1="60" x2="470" y2="250" stroke="#1f2a44" stroke-width="2"/>
  <rect x="445.0" y="110" width="50" height="80" fill="#1f2a44" stroke="#1f2a44" stroke-width="2"/>
  <text x="150" y="282" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2a44" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">Bullish: close above open</text>
  <text x="470" y="282" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1f2a44" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">Bearish: close below open</text>
  <line x1="178" y1="60" x2="222" y2="60" stroke="#5a6178" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="228" y="64" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#5a6178" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">High</text>
  <line x1="178" y1="110" x2="222" y2="110" stroke="#5a6178" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="228" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#5a6178" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">Close</text>
  <line x1="178" y1="190" x2="222" y2="190" stroke="#5a6178" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="228" y="194" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#5a6178" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">Open</text>
  <line x1="178" y1="250" x2="222" y2="250" stroke="#5a6178" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="228" y="254" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#5a6178" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">Low</text>
  <line x1="442" y1="60" x2="398" y2="60" stroke="#5a6178" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="392" y="64" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#5a6178" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">High</text>
  <line x1="442" y1="110" x2="398" y2="110" stroke="#5a6178" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="392" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#5a6178" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">Open</text>
  <line x1="442" y1="190" x2="398" y2="190" stroke="#5a6178" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="392" y="194" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#5a6178" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">Close</text>
  <line x1="442" y1="250" x2="398" y2="250" stroke="#5a6178" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="392" y="254" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="end" fill="#5a6178" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">Low</text>
  <text x="150" y="155" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2a44" font-weight="bold">Body</text>
  <text x="470" y="155" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">Body</text>
  <text x="60" y="85" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6178" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">Upper shadow</text>
  <text x="60" y="225" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6178" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">Lower shadow</text>
  <text x="560" y="85" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6178" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">Upper shadow</text>
  <text x="560" y="225" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5a6178" font-weight="normal" stroke="#fbfaf6" stroke-width="4" paint-order="stroke">Lower shadow</text>
</svg>
