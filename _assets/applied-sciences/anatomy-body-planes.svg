<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Body planes in the anatomical position</title>
  <desc id="d">Two schematic figures in the anatomical position. In the front view, a vertical sagittal plane divides the body into right and left halves and a horizontal transverse plane divides it into upper and lower parts. In the side view, a vertical frontal plane divides the body into front and back parts.</desc>
  <rect width="560" height="400" rx="14" fill="#fbfaf7" stroke="#d8d3c8"/>
  <text x="140" y="30" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Front view</text>
  <text x="420" y="30" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Side view</text>
  <g fill="#e9e4da" stroke="#6b7a90" stroke-width="2">
    <circle cx="140" cy="75" r="22"/>
    <rect x="112" y="102" width="56" height="110" rx="14"/>
    <rect x="88" y="106" width="18" height="100" rx="9"/>
    <rect x="174" y="106" width="18" height="100" rx="9"/>
    <rect x="114" y="214" width="22" height="130" rx="10"/>
    <rect x="144" y="214" width="22" height="130" rx="10"/>
    <circle cx="420" cy="75" r="22"/>
    <rect x="400" y="102" width="40" height="110" rx="14"/>
    <rect x="410" y="106" width="18" height="100" rx="9"/>
    <rect x="408" y="214" width="24" height="130" rx="10"/>
  </g>
  <line x1="140" y1="40" x2="140" y2="365" stroke="#2f7d5b" stroke-width="3" stroke-dasharray="8 5"/>
  <line x1="60" y1="190" x2="220" y2="190" stroke="#b9761a" stroke-width="3" stroke-dasharray="8 5"/>
  <line x1="420" y1="40" x2="420" y2="365" stroke="#7a4fa3" stroke-width="3" stroke-dasharray="8 5"/>
  <g font-size="12" fill="#1f2933">
    <text x="146" y="385" fill="#2f7d5b">Sagittal plane: right and left</text>
    <text x="198" y="212" fill="#b9761a">Transverse plane:</text>
    <text x="198" y="228" fill="#b9761a">upper and lower</text>
    <text x="548" y="385" fill="#7a4fa3" text-anchor="end">Frontal plane: front and back</text>
    <text x="340" y="160">Anterior</text>
    <text x="455" y="160">Posterior</text>
    <text x="70" y="120">Right</text>
    <text x="196" y="120">Left</text>
  </g>
</svg>
